async function loadVisitorCount(){
  try{
    const {data,error}=await sb.rpc('site_visit_count');
    if(error)throw error;
    const el=$('#visitorTotal');
    if(el)el.textContent=bd(data||0);
  }catch(e){
    const el=$('#visitorTotal');
    if(el)el.textContent='কাউন্ট পাওয়া যায়নি';
    console.warn('Visitor counter:',e.message||e);
  }
}
