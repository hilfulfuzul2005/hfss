const C={
activities:{t:'সংগঠনের কার্যক্রম',f:[['title','শিরোনাম'],['desc','বিবরণ','t']]},

msgs:{t:'বাণী',f:[['by','নাম'],['post','পদবি'],['txt','বাণী','t']]},

leaders:{t:'বর্তমান নেতৃত্ব',f:[['name','নাম'],['post','পদবি','s','সভাপতি|সাধারণ সম্পাদক'],['session','সেশন'],['mob','মোবাইল'],['photo','ছবি','i']]},
exec:{t:'কার্যকরী পরিষদ',pub:['name','post'],f:[['name','নাম'],['post','পদবি'],['mob','মোবাইল']]},
gen:{t:'সাধারণ পরিষদ',pub:['name'],f:[['name','নাম'],['mob','মোবাইল']]},
advisors:{t:'উপদেষ্টাদের তালিকা',pub:['name','note'],f:[['name','নাম'],['note','বিবরণ'],['mob','মোবাইল']]},
donors:{t:'দাতা সদস্যদের তালিকা',pub:['name','note'],f:[['name','নাম'],['note','বিবরণ'],['amt','অনুদান (৳)','n']]},
land:{t:'ভূমিদাতাদের তালিকা',pub:['name','note'],f:[['name','নাম'],['note','জমির বিবরণ']]},
past:{t:'সাবেক সভাপতিবৃন্দ',pub:['name','term'],f:[['name','নাম'],['term','মেয়াদকাল']]},
events:{t:'অনুষ্ঠানসমূহ',f:[['title','অনুষ্ঠানের নাম'],['date','তারিখ','d'],['desc','বিবরণ','t']]},
branches:{t:'অঙ্গ প্রতিষ্ঠান',f:[['name','প্রতিষ্ঠানের নাম'],['addr','ঠিকানা'],['desc','বিবরণ','t']]},
news:{t:'সংগঠন নিউজ',f:[['title','শিরোনাম'],['date','তারিখ','d'],['txt','বিস্তারিত','t'],['img','ছবি','i']]},
results:{t:'পরীক্ষার ফলাফল',f:[['year','সাল'],['level','পর্যায়','s',LV],['cls','শ্রেণী'],['roll','রোল নম্বর'],['name','শিক্ষার্থীর নাম'],['res','ফলাফল/প্রাপ্ত নম্বর'],['note','মন্তব্য']]},
apps:{t:'বৃত্তি পরীক্ষার আবেদন',pub:['name','level','cls','school','year','roll'],f:[['name','শিক্ষার্থীর নাম'],['father','পিতার নাম'],['mother','মাতার নাম'],['dob','জন্ম তারিখ','d'],['mob','মোবাইল'],['school','বিদ্যালয়'],['level','পর্যায়','s',LV],['cls','শ্রেণী'],['addr','ঠিকানা'],['photo','ছবি','i'],['year','সাল','h'],['roll','রোল নম্বর','h']]},
members:{t:'সদস্য',pub:['name','member_no','join_date','status'],f:[['name','নাম'],['member_no','সদস্য আইডি'],['join_date','যোগদানের তারিখ','d'],['dob','জন্ম তারিখ','d'],['father','পিতার নাম'],['mother','মাতার নাম'],['mobile','মোবাইল'],['status','অবস্থা','s',ST],['pw','লগইন পাসওয়ার্ড (কমপক্ষে ৬)','p']]},
ledger:{t:'আয়-ব্যয়',f:[['date','তারিখ','d'],['type','ধরন','s','আয়|ব্যয়'],['head','খাত'],['amt','টাকা','n'],['note','মন্তব্য']]},
pay:{t:'সদস্যদের চাঁদা জমা',f:[['mid','সদস্য আইডি'],['date','জমার তারিখ','d'],['kind','চাঁদার প্রকার','s',KD],['paid','জমা (৳)','n']]},
dues:{t:'বকেয়া চাঁদা',f:[['mid','সদস্য আইডি'],['kind','চাঁদার প্রকার','s',KD],['amt','বাকি (৳)','n']]},
assets:{t:'সম্পদের বিবরণ',f:[['name','সম্পদ'],['desc','বিবরণ'],['val','মূল্য (৳)','n']]}};
const FIN=['ledger','pay','dues','assets'];
let SB='res',SR=null,ERRS=[],P={},tab='home',U={r:'pub'},D={items:{},fin:{},members:[],results:[],apps:[],audit:[]};
const isStaff=()=>['admin','gs','fin'].includes(U.r);
const can=c=>FIN.includes(c)?U.r==='fin':(U.r==='admin'||U.r==='gs');
const tb=c=>FIN.includes(c)?'fin_items':c==='apps'?'applications':c==='members'||c==='results'?c:'items';
const rows=c=>c==='members'?D.members:c==='results'?D.results:c==='apps'?D.apps:FIN.includes(c)?(D.fin[c]||[]):(D.items[c]||[]);
const SET=()=>Object.assign({name:'হিলফুল ফুযুল শান্তি সংঘ',reg:'পটিয়া উপজেলা সমাজসেবায় নিবন্ধিত রেজিঃ নং- চট্ট: ৩১২৭/২০১৬ইং',addr:'কৈয়গ্রাম, পটিয়া, চট্টগ্রাম।'},(D.items.settings||[])[0]||{});
const busy=v=>{$('#ld').style.display=v?'block':'none'};
async function get(n,p){try{const {data,error}=await p;if(error)throw error;try{localStorage.setItem('c_'+n,JSON.stringify(data))}catch(e){}return data}catch(e){ERRS.push((e&&e.message)||String(e));try{return JSON.parse(localStorage.getItem('c_'+n))||[]}catch(_){return[]}}}
const flat=a=>a.map(r=>({id:r.id,...r.data}));
async function loadAll(){ERRS=[];
const it=await get('items',sb.from('items').select('*').order('id'));D.items={};
for(const r of it)(D.items[r.kind]=D.items[r.kind]||[]).push({id:r.id,...r.data});
const st=U.r!=='pub';
D.members=await get('members',st?sb.from('members').select('*').order('id'):sb.from('members_public').select('*'));
D.fin={};if(st)for(const r of await get('fin',sb.from('fin_items').select('*').order('id')))(D.fin[r.kind]=D.fin[r.kind]||[]).push({id:r.id,...r.data});
const ag=['admin','gs'].includes(U.r);
D.results=ag?flat(await get('results',sb.from('results').select('*').order('id'))):[];
D.apps=ag?flat(await get('apps',sb.from('applications').select('*').order('id'))):await get('apps_pub',sb.from('applications_public').select('*').order('id'));
D.audit=U.r==='admin'?await get('audit',sb.from('audit').select('*').order('id',{ascending:false}).limit(40)):[]}
async function refresh(){busy(1);await loadAll();busy(0);render()}
async function init(){
try{const {data:{session}}=await sb.auth.getSession();
if(session){const {data,error:pe}=await sb.from('profiles').select('role,member_no').eq('id',session.user.id).maybeSingle();
if(pe)ERRS.push('ভূমিকা জানা যায়নি: '+pe.message);else if(!data)ERRS.push('এই আইডির কোনো ভূমিকা বসানো নেই');
if(data)U={r:data.role==='member'?'mem':data.role,id:data.member_no};if(U.r==='mem')tab='me'}}catch(e){}
const pre=ERRS.slice();await loadAll();ERRS.unshift(...pre);render()}
async function login(){const i=nb($('#li').value).toLowerCase(),p=$('#lp').value;if(!i||!p)return;busy(1);
const {error}=await sb.auth.signInWithPassword({email:i+'@hfss.app',password:p});busy(0);
if(error)return alert('লগইন হয়নি: '+error.message);tab='home';await init()}
async function logout(){await sb.auth.signOut();for(const k of['members','fin','results','audit','apps'])localStorage.removeItem('c_'+k);U={r:'pub'};tab='home';await refresh()}
function pick(el,key){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,800/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*m;cv.height=im.height*m;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cv.toBlob(b=>{P[key]=b},key==='logo'||key==='exlogo'?'image/png':'image/jpeg',.8)};im.src=r.result};r.readAsDataURL(f)}
async function up(b,pre){const p=(pre||'')+Date.now()+'.'+(b.type==='image/png'?'png':'jpg');const {error}=await sb.storage.from('media').upload(p,b,{contentType:b.type});if(error){alert('ছবি আপলোড ব্যর্থ: '+error.message);return''}return sb.storage.from('media').getPublicUrl(p).data.publicUrl}
async function add(c){if(c==='apps'&&!can('apps')&&!formOpen().ok)return alert('ফরম পূরণের সময়কাল নেই');busy(1);try{const o={};
for(const [k,,t] of C[c].f)o[k]=t==='i'?(P[c+k]?await up(P[c+k],c==='apps'?'apply/':''):''):t==='h'?'':$('#f_'+c+'_'+k).value.trim();
if(c==='apps'){if(!o.name||!o.cls)return alert('শিক্ষার্থীর নাম ও শ্রেণী দিন');o.year=SET().ex_year||''}
if(!Object.entries(o).some(([k,v])=>v&&k!=='pw'))return;let e;
if(c==='members'){o.member_no=nb(o.member_no);const pw=o.pw;delete o.pw;for(const k of['join_date','dob'])o[k]=o[k]||null;
({error:e}=await sb.from('members').insert(o));
if(!e&&pw)({error:e}=await sb.rpc('create_login',{p_id:o.member_no,p_pw:pw,p_role:'member',p_member:o.member_no}));if(e&&pw)e.message='সদস্য যোগ হয়েছে, কিন্তু লগইন তৈরি হয়নি: '+e.message}
else if(c==='results'||c==='apps')({error:e}=await sb.from(tb(c)).insert({data:o}));
else{if(c==='pay'||c==='dues')o.mid=nb(o.mid);({error:e}=await sb.from(tb(c)).insert({kind:c,data:o}))}
if(e)alert('ত্রুটি: '+e.message);else if(c==='apps')alert('আপনার আবেদন জমা হয়েছে। ধন্যবাদ।');P={}}finally{busy(0)}await refresh()}
async function del(c,id){if(!confirm('মুছে ফেলবেন? (ইতিহাসে লেখা থাকবে)'))return;busy(1);const {data,error}=await sb.from(tb(c)).delete().eq('id',id).select();busy(0);if(error)alert('ত্রুটি: '+error.message);else if(!data.length)alert('মোছা যায়নি: অনুমতি নেই');await refresh()}
function edit(c,id){const r=rows(c).find(x=>x.id===id);if(!r)return;
const m=document.createElement('div');m.id='md';m.style.cssText='position:fixed;inset:0;background:#000b;z-index:20;overflow:auto;padding:14px';
m.innerHTML=`<div class="card fg" style="max-width:600px;margin:auto"><h3>সম্পাদনা: ${C[c].t}</h3>${C[c].f.filter(x=>x[2]!=='i'&&x[2]!=='p').map(([k,l,t,o])=>`<label>${l}${t==='t'?`<textarea id="e_${k}" rows=3>${esc(r[k])}</textarea>`:t==='s'?`<select id="e_${k}">${o.split('|').map(x=>`<option${x===r[k]?' selected':''}>${x}</option>`).join('')}</select>`:`<input id="e_${k}" type="${t==='d'?'date':t==='n'?'number':'text'}" value="${esc(r[k])}">`}</label>`).join('')}<button onclick="saveEdit('${c}',${id})">সংরক্ষণ করুন</button><button onclick="$('#md').remove()" style="background:var(--mu)">বাতিল</button></div>`;document.body.appendChild(m)}
async function saveEdit(c,id){const r=rows(c).find(x=>x.id===id),n={};
for(const [k,,t] of C[c].f){if(t==='i'||t==='p')continue;const v=$('#e_'+k).value.trim();n[k]=t==='d'&&!v?null:v}
if(c==='members')n.member_no=nb(n.member_no);busy(1);let q;
if(c==='members')q=await sb.from('members').update(n).eq('id',id).select();
else{const {id:_,...d}=r;q=await sb.from(tb(c)).update({data:{...d,...n}}).eq('id',id).select()}

const ph=a=>a.photo?`<img src="${esc(a.photo)}" style="float:right;width:110px;height:130px;object-fit:cover;border:1px solid #000;margin:0 0 8px 8px">`:'';
function pdfForm(id){const a=rows('apps').find(x=>x.id===id);if(!a)return;pr(`${exHead(a.year)}<h2 style="text-align:center;color:#8b1a1a">আবেদন ফরম</h2>${ph(a)}<table>${C.apps.f.filter(x=>x[2]!=='i').map(x=>`<tr><th>${x[1]}</th><td>${esc(a[x[0]])}</td></tr>`).join('')}</table>`,1)}
const admitH=a=>{const s=SET();return`<div class="ac">${exHead(a.year)}<h3 style="text-align:center;color:#8b1a1a;margin:2px 0 6px;border:0;padding:0">প্রবেশ পত্র</h3>${ph(a)}<table>${[['name','পরীক্ষার্থীর নাম'],['father','পিতার নাম'],['mother','মাতার নাম'],['level','পর্যায়'],['cls','শ্রেণী'],['roll','রোল নম্বর'],['school','বিদ্যালয়']].map(([k,l])=>`<tr><th>${l}</th><td>${esc(a[k])}</td></tr>`).join('')}<tr><th>পরীক্ষার তারিখ ও সময়</th><td>${esc(s.ex_date)}</td></tr><tr><th>পরীক্ষার কেন্দ্র</th><td>${esc(s.ex_venue)}</td></tr></table><div class="sg"><span>পরিচালকের স্বাক্ষর</span><span>নিয়ন্ত্রকের স্বাক্ষর</span></div></div>`};
function admit(id){const a=rows('apps').find(x=>x.id===id);if(!a)return;if(!a.roll)return alert('আগে "রোল নম্বর বরাদ্দ করুন" চাপুন');pr(admitH(a),1)}
function admitAll(){const L=rows('apps').filter(a=>a.roll);if(!L.length)return alert('আগে "রোল নম্বর বরাদ্দ করুন" চাপুন');pr(L.map(admitH).join(''),1)}
const toLoc=i=>{if(!i)return'';const d=new Date(i),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
const fdt=i=>i?new Date(i).toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'}):'—';
function formOpen(){const s=SET(),a=s.ex_start,b=s.ex_end,n=Date.now(),t=`<b>ফরম পূরণের সময়কাল:</b> ${fdt(a)} থেকে ${fdt(b)} পর্যন্ত`,r=m=>`<br><span style="color:var(--re);font-weight:700">${m}</span>`;
if(!a||!b)return{ok:false,msg:t+r('ফরম পূরণের সময় এখনো নির্ধারণ করা হয়নি।')};
if(n<new Date(a))return{ok:false,msg:t+r('ফরম পূরণ এখনো শুরু হয়নি।')};
if(n>new Date(b))return{ok:false,msg:t+r('ফরম পূরণের সময় শেষ হয়ে গেছে।')};
return{ok:true,msg:t+'<br><span class="ok">ফরম পূরণ চলছে। জমা দেওয়া আবেদনের নাম, শ্রেণী ও বিদ্যালয় "আবেদন" ট্যাবে সবাই দেখতে পাবে।</span>'}}
const leaders=()=>{const L=rows('leaders').slice().sort((a,b)=>(a.post==='সভাপতি'?0:1)-(b.post==='সভাপতি'?0:1));return`<h3>বর্তমান নেতৃত্ব</h3><div class="g2">${L.map(a=>`<div class="card" style="text-align:center">${a.photo?`<img src="${esc(a.photo)}" style="width:120px;height:140px;object-fit:cover;border-radius:10px;border:2px solid var(--pr)">`:''}<div><b>${esc(a.name)}</b></div><div style="color:var(--re);font-weight:600">${esc(a.post)}</div><div>সেশন: ${esc(a.session)}</div><div>📞 ${esc(a.mob)}</div>${can('leaders')?`<button class="e" onclick="edit('leaders',${a.id})">সম্পাদনা</button><button class="x" onclick="del('leaders',${a.id})">মুছুন</button>`:''}</div>`).join('')||'<p class="mu">তথ্য দেওয়া হয়নি</p>'}</div>${form('leaders')}`};
const bd=s=>String(s??'').replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const yrs=()=>{const y=nb(SET().ex_year||'');return'<option value="">নির্বাচন করুন</option>'+Array.from({length:17},(_,i)=>2024+i).map(v=>`<option value="${v}"${String(v)===y?' selected':''}>${bd(v)}</option>`).join('')};
const rollPanel=()=>`<div class="card fg"><b>পরীক্ষার সাল (আবেদন ফরম ও প্রবেশপত্রে দেখাবে)</b><select id="yr_sel">${yrs()}</select><button onclick="saveYear()">সাল সংরক্ষণ</button></div><div class="card fg"><b>রোল নম্বর তৈরি (শ্রেণী অনুযায়ী)</b><label>পর্যায়<select id="rl_lv" onchange="$('#rl_px').value=this.value.startsWith('স্কুল')?'S-':'M-'">${LV.split('|').map(x=>`<option>${x}</option>`).join('')}</select></label><label>রোলের শুরুর অক্ষর<input id="rl_px" value="S-"></label><label>শ্রেণী (যেমন: ১)<input id="rl_cl"></label><label>এই শ্রেণীর ১ম জনের রোল সংখ্যা (যেমন: 101)<input id="rl_st" inputmode="numeric"></label><button onclick="assignRolls()">এই শ্রেণীর রোল তৈরি করুন</button></div>`;
async function saveYear(){const d={...SET(),ex_year:$('#yr_sel').value},ex=(D.items.settings||[])[0];busy(1);
const {error}=ex?await sb.from('items').update({data:d}).eq('id',ex.id):await sb.from('items').insert({kind:'settings',data:d});busy(0);if(error)alert('ত্রুটি: '+error.message);await refresh()}
async function assignRolls(){const lv=$('#rl_lv').value,px=$('#rl_px').value.trim(),cl=nb($('#rl_cl').value),st=parseInt(nb($('#rl_st').value));
if(!cl||isNaN(st))return alert('শ্রেণী ও ১ম জনের রোল সংখ্যা দিন');
const L=rows('apps').filter(a=>a.level===lv&&nb(a.cls)===cl),used=L.filter(a=>a.roll).map(a=>parseInt(nb(a.roll).replace(/\D/g,''))||0);
let n=used.length?Math.max(...used)+1:st;const N=L.filter(a=>!a.roll);
if(!N.length)return alert('এই পর্যায় ও শ্রেণীতে রোল নেই এমন কোনো আবেদন নেই');
if(!confirm(N.length+' জনের রোল '+px+n+' থেকে শুরু হবে। ঠিক আছে?'))return;busy(1);
for(const a of N){const {id,...d}=a;const {error}=await sb.from('applications').update({data:{...d,roll:px+n}}).eq('id',id);if(error){alert('ত্রুটি: '+error.message);break}n++}busy(0);await refresh()}
/* ট্যাব */
const TL={home:['হোম'],news:['সংগঠন নিউজ'],branches:['অঙ্গ প্রতিষ্ঠান'],sch:['বৃত্তি পরীক্ষা'],events:['অনুষ্ঠান'],apps:['আবেদন'],notices:['নোটিশ'],members:['সদস্য'],exec:['কার্যকরী পরিষদ'],gen:['সাধারণ পরিষদ'],lists:['তালিকা'],fin:['আয়-ব্যয় ও হিসাব',()=>isStaff()],me:['আমার হিসাব',()=>U.r==='mem'],adm:['অ্যাডমিন',()=>U.r==='admin'],lg:['লগইন',()=>U.r==='pub'],out:['লগআউট',()=>U.r!=='pub']};
const R=[['home','notices','news','branches','sch','events','apps'],['members','exec','gen','lists','fin','me','adm','lg','out']];
function go(t){if(t==='out')return logout();tab=t;SR=null;SB='res';render()}
const bn=()=>ERRS.length?`<div class="card" style="border-left-color:var(--re)"><b style="color:var(--re)">⚠ সমস্যা:</b> ${esc(ERRS[0])}<br><span class="mu">(সার্ভারের তথ্য আনা যায়নি; থাকলে আগের সংরক্ষিত তথ্য দেখানো হচ্ছে)</span></div>`:'';
function render(){const s=SET();
$('#hd').innerHTML=`${s.logo?`<img src="${esc(s.logo)}" alt="লোগো">`:''}<div><h1>${esc(s.name)}</h1><p>${esc(s.reg)}</p><p>${esc(s.addr)}</p></div>`;
$('#bar').innerHTML=R.map(r=>`<div class="rw">${r.filter(k=>!TL[k][1]||TL[k][1]()).map(k=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${TL[k][0]}</button>`).join('')}</div>`).join('');
$('#main').innerHTML=bn()+(tab==='lg'?`<div class="card fg"><h3>লগইন</h3><label>আইডি<input id="li" autocapitalize="none"></label><label>পাসওয়ার্ড<input id="lp" type="password"></label><button onclick="login()">প্রবেশ</button></div>`:(V[tab]||V.home)())}
let DP=null;const isSA=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!isSA())$('#ins').style.display='block';
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e});
addEventListener('appinstalled',()=>{$('#ins').style.display='none'});
async function installApp(){if(DP){DP.prompt();await DP.userChoice;DP=null;return}alert(/iphone|ipad|ipod/i.test(navigator.userAgent)?'Safari-তে নিচের শেয়ার (⬆) বাটন চেপে "Add to Home Screen" বেছে নিন।':'ব্রাউজারের মেনু (⋮) চেপে "Install app" বা "Add to Home screen" বেছে নিন।')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();init();
</script></body></html>
