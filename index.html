function pickF(el,key){P[key]=el.files[0]}
function pick(el,key){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,(key.startsWith('covers')?1600:800)/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*m;cv.height=im.height*m;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cv.toBlob(b=>{P[key]=b},key==='logo'||key==='exlogo'||key==='finsig'?'image/png':'image/jpeg',.8)};im.src=r.result};r.readAsDataURL(f)}
async function up(b,pre){const ex=((b.name||'').split('.').pop()||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||(b.type==='image/png'?'png':'jpg');const p=(pre||'')+Date.now()+'.'+ex;const {error}=await sb.storage.from('media').upload(p,b,{contentType:b.type||'application/octet-stream'});if(error){alert('ছবি আপলোড ব্যর্থ: '+error.message);return''}return sb.storage.from('media').getPublicUrl(p).data.publicUrl}

async function srch(){const a=[1,2,3,4].map(i=>$('#s'+i).value);busy(1);const {data,error}=await sb.rpc('find_result',{lvl:a[0],cls:a[1],roll:$('#rpx').textContent+a[2].replace(/^\s*[SsMm]-?/,'').trim(),yr:a[3]});busy(0);if(error)return alert('ত্রুটি: '+error.message);SR=data||[];render()}
async function saveSet(){busy(1);const d={...SET()};for(const k of['name','reg','addr','fb','yt','web','email','ph1','ph2','ph3','ex_year','ex_venue','ex_date','ex_start','ex_end','regno','est_date','cover_h','fin_name','pay_url'])d[k]=$('#a_'+k).value.trim();for(const k of['ex_start','ex_end'])d[k]=d[k]?new Date(d[k]).toISOString():'';if(P.logo)d.logo=await up(P.logo);if(P.exlogo)d.ex_logo=await up(P.exlogo);if(P.finsig)d.fin_sig=await up(P.finsig);
const ex=(D.items.settings||[])[0];let e;
if(ex)({error:e}=await sb.from('items').update({data:d}).eq('id',ex.id));else({error:e}=await sb.from('items').insert({kind:'settings',data:d}));
busy(0);if(e)alert('ত্রুটি: '+e.message);P={};await refresh()}
async function mkLogin(){const i=nb($('#l_id').value).toLowerCase(),r=$('#l_r').value;busy(1);
const {error}=await sb.rpc('create_login',{p_id:i,p_pw:$('#l_pw').value,p_role:r,p_member:r==='member'?i:null});busy(0);alert(error?(/duplicate|users_email/.test(error.message)?'এই আইডির লগইন আগেই তৈরি করা আছে। পাসওয়ার্ড বদলাতে নিচের "বিদ্যমান আইডির পাসওয়ার্ড বদল" বাটন চাপুন।':'ত্রুটি: '+error.message):'লগইন তৈরি হয়েছে')}

const tH=(c,list)=>{const f=C[c].f.filter(x=>x[2]!=='p'&&x[2]!=='i'&&x[2]!=='m');return`<table><tr>${f.map(x=>`<th>${x[1].split(' (')[0]}</th>`).join('')}</tr>${list.map(r=>`<tr>${f.map(x=>`<td>${esc(r[x[0]])}</td>`).join('')}</tr>`).join('')}</table>`};

function csv(name,head,list){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const t='\ufeff'+[head.map(q).join(','),...list.map(r=>r.map(q).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';document.body.appendChild(a);a.click();a.remove()}
function exp(c,n){const f=C[c].f.filter(x=>x[2]!=='p'&&x[2]!=='i'&&x[2]!=='m');csv(n,f.map(x=>x[1].split(' (')[0]),rows(c).map(r=>f.map(x=>r[x[0]])))}

async function rcptPub(){const no=nb($('#rn').value),mb=$('#rm').value;if(!no||!mb)return alert('রসিদ নম্বর ও মোবাইল নম্বর দিন');busy(1);const {data,error}=await sb.rpc('find_receipt',{p_no:+no,p_mob:mb});busy(0);if(error)return alert('ত্রুটি: '+error.message);if(!data)return alert('মিলছে না। রসিদ নম্বর ও মোবাইল নম্বর ঠিক আছে কিনা দেখুন।');pr(rcptH(data,data.name||''))}

const bn=()=>ERRS.length?`<div class="card" style="border-left-color:var(--re)"><b style="color:var(--re)">⚠ সমস্যা:</b> ${esc(ERRS[0])}<br><span class="mu">(সার্ভারের তথ্য আনা যায়নি; থাকলে আগের সংরক্ষিত তথ্য দেখানো হচ্ছে)</span></div>`:'';
function render(){const s=SET();
const cov=rows('covers').filter(c=>c.photo),sig=JSON.stringify([s.name,s.logo,s.addr,s.reg,s.est_year,s.est_date,s.regno,s.cover_h,cov.map(c=>c.photo)]);
if(sig!==HS){HS=sig;const hh={'ছোট':200,'মাঝারি':300,'বড়':440}[s.cover_h||'মাঝারি']||300;
$('#top').innerHTML=`<div>${[s.regno?esc(s.regno):'',estY(s)?'প্রতিষ্ঠাকাল: '+esc(estY(s)):''].filter(Boolean).join(' &nbsp;|&nbsp; ')||'স্বেচ্ছাসেবী সংগঠন'}</div><div class="sb"><input id="qs" placeholder="এখানে খুঁজুন…" onkeydown="if(event.key==='Enter')doSearch()"><button onclick="doSearch()">🔍</button></div>`;
$('#hd').style.minHeight=hh+'px';
$('#hd').innerHTML=cov.map((c,i)=>`<div class="sl${i?'':' on'}" style="background-image:url('${esc(c.photo)}')"></div>`).join('')+`<div class="ct">${s.logo?`<img class="lg" src="${esc(s.logo)}" alt="লোগো">`:''}<div><h1>${esc(s.name)}</h1><p>${esc(s.addr)}</p><p>${esc(s.reg)}</p>${estF(s)?`<p>প্রতিষ্ঠাকাল: ${esc(estF(s))}</p>`:''}</div></div>`;startSlides()}
$('#bar').innerHTML=R.map(r=>`<div class="rw">${r.filter(k=>!TL[k][1]||TL[k][1]()).map(k=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${TL[k][0]}</button>`).join('')}</div>`).join('');
$('#main').innerHTML=bn()+(tab==='lg'?`<div class="card fg"><h3>লগইন</h3><label>আইডি<input id="li" autocapitalize="none"></label><label>পাসওয়ার্ড<input id="lp" type="password"></label><button onclick="login()">প্রবেশ</button></div>`:(V[tab]||V.home)());if(NH&&tab==='news'){const e=$('#n_'+NH);if(e)e.scrollIntoView()}}
setInterval(()=>document.querySelectorAll('.ss').forEach(e=>{const im=e.querySelectorAll('img');if(im.length<2)return;let i=0;im.forEach((x,j)=>{if(x.classList.contains('on'))i=j});im[i].classList.remove('on');im[(i+1)%im.length].classList.add('on')}),5000);
let DP=null;const isSA=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!isSA())$('#ins').style.display='block';
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e});
addEventListener('appinstalled',()=>{$('#ins').style.display='none'});
async function installApp(){if(DP){DP.prompt();await DP.userChoice;DP=null;return}alert(/iphone|ipad|ipod/i.test(navigator.userAgent)?'Safari-তে নিচের শেয়ার (⬆) বাটন চেপে "Add to Home Screen" বেছে নিন।':'ব্রাউজারের মেনু (⋮) চেপে "Install app" বা "Add to Home screen" বেছে নিন।')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
route();render();init();
</script></body></html>
