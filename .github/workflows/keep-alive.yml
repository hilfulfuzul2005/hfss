name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Error: Supabase secrets are missing!"
            exit 1
          fi

          URL=$(echo "$SUPABASE_URL" | tr -d '[:space:]')
          URL="${URL%/}"

          echo "Checking Supabase connection..."

          HTTP_CODE=$(curl --globoff -sS -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/blood_donors?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Supabase ping successful!"
          else
            echo "Supabase ping failed!"
            exit 1
          fi
