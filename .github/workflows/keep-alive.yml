name: Keep Supabase Alive

on:
  schedule:
    # প্রতি ৩ দিন পরপর চলবে
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -fsS -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/blood_donors?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_API_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_API_KEY }}"
