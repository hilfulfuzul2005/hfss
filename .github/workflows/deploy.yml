name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sync to cPanel public_html
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Authentication
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy files via Tar Stream over SSH
        run: |
          tar \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='.htaccess' \
            --exclude='.user.ini' \
            --exclude='.well-known' \
            --exclude='cgi-bin' \
            --exclude='php.ini' \
            -czf - . | ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "tar -xzf - -C /home/${{ secrets.SSH_USER }}/public_html/"
